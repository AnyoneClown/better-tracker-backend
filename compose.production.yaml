name: better-tracker-backend

x-app-environment: &app-environment
  env_file:
    - .env.production

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    <<: *app-environment
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
