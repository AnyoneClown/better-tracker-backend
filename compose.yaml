name: better-tracker-backend

x-app-environment: &app-environment
  APP_NAME: "${APP_NAME:-Better Tracker API}"
  ENVIRONMENT: "${ENVIRONMENT:-development}"
  DATABASE_URL: "${COMPOSE_DATABASE_URL:-cockroachdb+asyncpg://root@db:26257/tracker}"
  DATABASE_ECHO: "${DATABASE_ECHO:-false}"
  REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
  CACHE_TTL_SECONDS: "${CACHE_TTL_SECONDS:-300}"
  CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:43127"]}'
  JWT_SECRET_KEY: "${JWT_SECRET_KEY:-development-only-secret-change-before-running-in-production}"
  JWT_ISSUER: "${JWT_ISSUER:-better-tracker-api}"
  JWT_AUDIENCE: "${JWT_AUDIENCE:-better-tracker-api}"
  ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE_MINUTES:-30}"
  GOOGLE_OAUTH_CLIENT_ID: "${GOOGLE_OAUTH_CLIENT_ID:-}"
  GOOGLE_OAUTH_CLIENT_SECRET: "${GOOGLE_OAUTH_CLIENT_SECRET:-}"
  MONOBANK_TOKEN_ENCRYPTION_KEY: "${MONOBANK_TOKEN_ENCRYPTION_KEY:-YmV0dGVyLXRyYWNrZXItbW9ub2JhbmstZGV2LWtleSE=}"

services:
  redis:
    image: redis:8.6.4-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - "${REDIS_MAXMEMORY:-128mb}"
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  db:
    image: cockroachdb/cockroach:v26.2.3
    command:
      - start-single-node
      - --insecure
      - --listen-addr=:26257
      - --http-addr=:8080
      - --advertise-addr=db:26257
      - --store=/cockroach/cockroach-data
    ports:
      - "127.0.0.1:26257:26257"
      - "127.0.0.1:${COCKROACH_HTTP_PORT:-18080}:8080"
    volumes:
      - cockroach-data:/cockroach/cockroach-data
    healthcheck:
      test:
        - CMD
        - /cockroach/cockroach
        - sql
        - --insecure
        - --host=localhost:26257
        - --execute=SELECT 1;
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    stop_grace_period: 60s

  db-init:
    image: cockroachdb/cockroach:v26.2.3
    command:
      - sql
      - --insecure
      - --host=db:26257
      - --execute=CREATE DATABASE IF NOT EXISTS tracker;
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment: *app-environment
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment: *app-environment
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

volumes:
  cockroach-data:
