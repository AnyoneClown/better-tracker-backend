[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "better-tracker-backend"
version = "0.1.0"
description = "Async API for Better Tracker"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.18.5",
    "asyncpg==0.31.0",
    "fastapi==0.139.2",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "SQLAlchemy[asyncio]==2.0.51",
    "sqlalchemy-cockroachdb==2.0.4",
    "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "mypy==2.3.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.0.0",
    "ruff==0.16.0",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: requires a running local CockroachDB instance",
]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true
exclude = ["alembic/versions/"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "UP"]
